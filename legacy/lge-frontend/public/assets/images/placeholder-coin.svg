<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coinGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#coinGradient)" filter="url(#shadow)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#B8860B" stroke-width="2" opacity="0.5"/>
  
  <!-- Text around the coin -->
  <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B4513" transform="rotate(-15 100 50)">MEME</text>
  <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B4513" transform="rotate(15 100 150)">COIN</text>
  
  <!-- Sunglasses -->
  <g transform="translate(100, 100)">
    <!-- Left lens -->
    <ellipse cx="-25" cy="0" rx="20" ry="15" fill="#000000"/>
    <ellipse cx="-25" cy="0" rx="18" ry="13" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Right lens -->
    <ellipse cx="25" cy="0" rx="20" ry="15" fill="#000000"/>
    <ellipse cx="25" cy="0" rx="18" ry="13" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Bridge -->
    <rect x="-5" y="-5" width="10" height="3" fill="#000000"/>
    
    <!-- Left arm -->
    <rect x="-45" y="-2" width="20" height="3" fill="#000000"/>
    
    <!-- Right arm -->
    <rect x="25" y="-2" width="20" height="3" fill="#000000"/>
  </g>
  
  <!-- Highlight on coin -->
  <ellipse cx="80" cy="60" rx="15" ry="25" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 80 60)"/>
</svg>
