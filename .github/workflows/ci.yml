name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -p tsconfig.json --noEmit

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build

  showcase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run build
