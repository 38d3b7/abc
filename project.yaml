faq:
  - q: Why Arc?
    a: Settlement is in native USDC with sub-second finality, matching the product's need for an agent to hold and move business cash.
  - q: What does the model decide?
    a: The model proposes typed intents and writes rationales. Policy checks, quote math, and signing limits are deterministic code.
  - q: Is the Circle integration real?
    a: Wallet provisioning and transaction signing use Circle developer-controlled wallets on Arc-TESTNET; the wallet set is 06b8685e-b977-521e-bb61-d42db479df71.
  - q: Can a participant remove their LP?
    a: Before the cohort-level lock and while 30-day fee volume is below the launch threshold, yes. After the lock, the LP stays in the pool but fees keep accruing.
