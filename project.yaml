flow: Operator instructs agent → agent proposes typed intent → pipeline quotes, simulates, checks policy → agent wallet signs → transaction broadcasts → ledger records final state.
architecture:
  onchain: LGEHook v2 runs the token sale, pools USDC, custodies LP, splits swap fees, and locks LP when booked participant fees reach the raise size.
  offchain: Executor Hono API + pg-boss worker maintains intent state machine and Circle wallet signing.
  ai: LLM chooses intents and writes rationales; it cannot sign or exceed policy limits.
  deterministic: Policy checks, quote math, limit enforcement, and onchain execution are deterministic code.

novelty:
  new: A single console gives an agent a real wallet, token launch, and business-spending controls, with every intent ledgered and policy-enforced before signing.
  not_new: Uniswap v4 hooks, ERC-20 tokens, developer-controlled wallets, intent pipelines.
  why: Most agent tools move money without limits or are chat-only copilots. ABC binds model judgment to contract-enforced budgets and a ledger.

